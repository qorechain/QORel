name: QORel image to Docker Hub

# Copies an already published ghcr.io/qorechain/qorel image to Docker Hub
# (same manifest and digest, no rebuild) and signs it there. Needs the
# DOCKERHUB_TOKEN secret and the DOCKERHUB_USERNAME variable.
on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to copy, e.g. 0.1.0'
        type: string
        required: true
      latest:
        description: 'Also tag it latest on Docker Hub'
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  mirror:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
      id-token: write
    env:
      V: ${{ inputs.version }}
      LATEST: ${{ inputs.latest }}
    steps:
      - name: Check input
        run: |
          case "${V}" in
            ''|*[!0-9A-Za-z.-]*) echo "invalid version '${V}'"; exit 1 ;;
          esac
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - uses: docker/login-action@v3
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Copy ghcr.io -> docker.io
        id: copy
        run: |
          tags="-t docker.io/qorechain/qorel:${V}"
          if [ "${LATEST}" = "true" ]; then tags="${tags} -t docker.io/qorechain/qorel:latest"; fi
          docker buildx imagetools create ${tags} "ghcr.io/qorechain/qorel:${V}"
          digest="$(docker buildx imagetools inspect "docker.io/qorechain/qorel:${V}" --format '{{json .Manifest}}' | jq -r .digest)"
          src="$(docker buildx imagetools inspect "ghcr.io/qorechain/qorel:${V}" --format '{{json .Manifest}}' | jq -r .digest)"
          [ "${digest}" = "${src}" ] || { echo "digest mismatch: ${digest} vs ${src}"; exit 1; }
          echo "digest=${digest}" >> "$GITHUB_OUTPUT"
      - uses: sigstore/cosign-installer@v3
      - name: Sign on Docker Hub (keyless)
        env:
          DIGEST: ${{ steps.copy.outputs.digest }}
        run: cosign sign --yes "docker.io/qorechain/qorel@${DIGEST}"
