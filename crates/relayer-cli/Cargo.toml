[package]
name       = "ibc-relayer-cli"
version    = "1.13.2"
edition    = "2021"
license    = "Apache-2.0"
readme     = "README.md"
keywords   = ["blockchain", "consensus", "cosmos", "ibc", "tendermint"]
homepage   = "https://github.com/qorechain/QORel"
repository = "https://github.com/qorechain/QORel"
authors    = ["QoreChain <team@qorechain.io>", "Informal Systems <hello@informal.systems>"]
rust-version = "1.85.0"
description  = """
  QORel: IBC relayer for QoreChain and any Cosmos SDK chain, based on Hermes by Informal Systems
"""
default-run = "qorel"

[[bin]]
name = "qorel"

[[bin]]
name = "hermes"

[dependencies]
ibc-relayer-types  = { workspace = true }
ibc-relayer        = { workspace = true }
qorel-signer       = { workspace = true }
ibc-proto          = { workspace = true }
prost              = { workspace = true }
ibc-telemetry      = { workspace = true }
ibc-relayer-rest   = { workspace = true }
ibc-chain-registry = { workspace = true }

abscissa_core                    = { workspace = true, features = ["options"] }
clap                             = { workspace = true, features = ["cargo"] }
clap_complete                    = { workspace = true }
color-eyre                       = { workspace = true }
console                          = { workspace = true }
crossbeam-channel                = { workspace = true }
dialoguer                        = { workspace = true }
dirs-next                        = { workspace = true }
eyre                             = { workspace = true }
flex-error                       = { workspace = true, features = ["std", "eyre_tracer"] }
futures                          = { workspace = true }
hdpath                           = { workspace = true }
http                             = { workspace = true }
humantime                        = { workspace = true }
itertools                        = { workspace = true }
oneline-eyre                     = { workspace = true }
regex                            = { workspace = true }
serde                            = { workspace = true, features = ["serde_derive"] }
serde_json                       = { workspace = true }
signal-hook                      = { workspace = true }
subtle-encoding                  = { workspace = true }
tendermint-light-client-verifier = { workspace = true }
tendermint-rpc                   = { workspace = true, features = ["http-client", "websocket-client"] }
tendermint                       = { workspace = true, features = ["secp256k1"] }
time                             = { workspace = true }
tokio                            = { workspace = true, features = ["full"] }
tracing                          = { workspace = true }
tracing-subscriber               = { workspace = true, features = ["fmt", "env-filter", "json"] }

# Release builds compile OpenSSL into the binary (it is pulled in through reqwest's native-tls),
# so the Linux archives only need glibc. Enabled with `--features vendored-openssl`.
[target.'cfg(target_os = "linux")'.dependencies]
openssl = { version = "0.10", features = ["vendored"], optional = true }

[features]
vendored-openssl = ["dep:openssl"]

[dev-dependencies]
abscissa_core = { workspace = true, features = ["testing"] }
once_cell     = { workspace = true }
regex         = { workspace = true }
serial_test   = { workspace = true }
